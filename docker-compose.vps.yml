services:
  postgres:
    image: postgres:15-alpine
    container_name: energy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_data}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-trading_data}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    container_name: energy_fastapi
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      CHRONOS_DEVICE_MAP: ${CHRONOS_DEVICE_MAP:-cpu}
      CHRONOS_MODEL_NAME: ${CHRONOS_MODEL_NAME:-amazon/chronos-t5-small}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  streamlit:
    build: .
    container_name: energy_streamlit
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PREDICTION_API_URL: http://fastapi:8000/predict
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]

  worker:
    build: .
    profiles: ["jobs"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PREDICTION_API_URL: http://fastapi:8000/predict
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: ["python", "-c", "print('worker ready')"]

volumes:
  pg_data:
